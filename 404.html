<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Bal Krishan Swami</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <script>
        try { var t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
    </script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <main class="section" style="min-height:100vh;display:grid;place-items:center;text-align:center">
        <div class="container">
            <p class="section-label" style="justify-content:center">404</p>
            <h1 style="font-size:var(--fs-h2);margin-bottom:1rem">This page doesn't exist.</h1>
            <p class="lead" style="margin-bottom:2rem">The link may be old. The portfolio lives on one page.</p>
            <a class="btn btn--primary" href="/">Back to the portfolio</a>
        </div>
    </main>
</body>
</html>
